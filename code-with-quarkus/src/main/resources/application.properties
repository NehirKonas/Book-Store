# --- MySQL ---
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=book
quarkus.datasource.password=book
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/bookstore?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8

# Turn OFF Dev Services / Testcontainers (you use a real MySQL)
quarkus.devservices.enabled=false

# --- Hibernate ---
# For local dev while you stabilize the schema:
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true
quarkus.hibernate-orm.log.bind-parameters=true
quarkus.hibernate-orm.sql-load-script=import.sql

# --- Swagger UI ---
quarkus.swagger-ui.always-include=true

# --- CORS ---
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
